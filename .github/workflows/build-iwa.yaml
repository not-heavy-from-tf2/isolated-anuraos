name: Build & Sign Isolated Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build AnuraOS static site
        run: |
          sudo apt-get update && sudo apt-get install -y jq uuid-runtime curl

          # Create dummy .gitmodules if missing so Makefile targets don't fail
          touch .gitmodules

          # Build core libraries, TypeScript bundle, CSS, and config
          make build/bootstrap
          make external-libs || true
          make bundle
          make public/config.json || true

          # Assemble final web root into static/ matching Makefile's static target
          rm -rf static && mkdir -p static
          cp -r public/* static/
          cp -r build/* static/
          [ -d "bin" ] && cp -r bin static/
          [ -d "apps" ] && cp -r apps static/
          [ -d "external/anura-browserjs/packages/chrome/dist" ] && cp -r external/anura-browserjs/packages/chrome/dist static/browser

          echo "=== Sample files in static/ ==="
          find static -maxdepth 4 | head -n 40

      - name: Bundle and Sign IWA
        env:
          IWA_PRIVATE_KEY: ${{ secrets.IWA_PRIVATE_KEY }}
        run: |
          npm install --no-save wbn wbn-sign mime-types

          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const { BundleBuilder } = require("wbn");
          const { IntegrityBlockSigner, NodeCryptoSigningStrategy, parsePemKey, WebBundleId } = require("wbn-sign");
          const mime = require("mime-types");

          (async () => {
            if (process.env.IWA_PRIVATE_KEY && process.env.IWA_PRIVATE_KEY.trim()) {
              fs.writeFileSync("private_key.pem", process.env.IWA_PRIVATE_KEY.trim() + "\n");
            } else {
              execSync("openssl genpkey -algorithm Ed25519 -out private_key.pem");
            }

            const privateKey = parsePemKey(fs.readFileSync("private_key.pem"));
            const bundleIdObj = new WebBundleId(privateKey);
            const webBundleId = await bundleIdObj.serialize();
            const baseUrl = await bundleIdObj.serializeWithIsolatedWebAppOrigin();
            console.log("Building IWA for origin:", baseUrl);

            const targetDir = "static";
            const builder = new BundleBuilder("b2");

            const headers = {
              "Cross-Origin-Opener-Policy": "same-origin",
              "Cross-Origin-Embedder-Policy": "credentialless",
              "Cross-Origin-Resource-Policy": "same-origin",
              "Content-Security-Policy": "base-uri 'none'; default-src 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:;"
            };

            const addedUrls = new Set();

            function addExchangeSafe(url, fileHeaders, content) {
              if (!addedUrls.has(url)) {
                addedUrls.add(url);
                builder.addExchange(url, 200, fileHeaders, content);
              }
            }

            function addFiles(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  addFiles(fullPath);
                } else {
                  let relPath = path.relative(targetDir, fullPath).replace(/\\/g, "/");
                  let contentType = mime.lookup(fullPath) || "application/octet-stream";
                  if (relPath.endsWith(".webmanifest")) contentType = "application/manifest+json";
                  if (relPath.endsWith(".js") || relPath.endsWith(".mjs") || relPath.endsWith(".ajs")) contentType = "application/javascript";

                  const fileHeaders = { ...headers, "Content-Type": contentType };
                  const content = fs.readFileSync(fullPath);

                  addExchangeSafe(baseUrl + relPath, fileHeaders, content);
                  if (relPath === "index.html") {
                    addExchangeSafe(baseUrl, fileHeaders, content);
                  }
                }
              }
            }

            addFiles(targetDir);

            // Find a valid >=144x144 square PNG in static/ by reading PNG IHDR dimensions
            let validIcon = null;
            for (const candidate of ["pwa_icon.png", "icon.png", "icon_dark.png"]) {
              const p = path.join(targetDir, candidate);
              if (fs.existsSync(p)) {
                const buf = fs.readFileSync(p);
                if (buf.length >= 24 && buf.toString("ascii", 12, 16) === "IHDR") {
                  const w = buf.readUInt32BE(16);
                  const h = buf.readUInt32BE(20);
                  console.log(`Checked ${candidate}: ${w}x${h}`);
                  if (w === h && w >= 144) {
                    validIcon = { src: "/" + candidate, sizes: `${w}x${h}`, type: "image/png" };
                    break;
                  }
                }
              }
            }

            if (!validIcon) {
              throw new Error("No >=144x144 square PNG icon found in static/!");
            }

            // Always write /.well-known/manifest.webmanifest with the verified icon
            let manifest = {
              name: "AnuraOS",
              short_name: "AnuraOS",
              version: "1.0.0",
              id: "/",
              start_url: "/",
              scope: "/",
              display: "standalone",
              icons: [validIcon]
            };

            if (fs.existsSync("static/manifest.json")) {
              try {
                const existing = JSON.parse(fs.readFileSync("static/manifest.json", "utf8"));
                manifest = {
                  ...existing,
                  version: existing.version || "1.0.0",
                  id: "/",
                  start_url: "/",
                  scope: "/",
                  icons: [validIcon]
                };
              } catch (e) {}
            }

            addExchangeSafe(
              baseUrl + ".well-known/manifest.webmanifest",
              { ...headers, "Content-Type": "application/manifest+json" },
              Buffer.from(JSON.stringify(manifest, null, 2))
            );
            console.log("Generated /.well-known/manifest.webmanifest with icon:", validIcon);

            console.log(`Total files packed into bundle: ${addedUrls.size}`);

            const unsignedBundle = builder.createBundle();

            const signer = new IntegrityBlockSigner(
              unsignedBundle,
              webBundleId,
              [new NodeCryptoSigningStrategy(privateKey)]
            );
            const { signedWebBundle } = await signer.sign();
            fs.writeFileSync("app.swbn", signedWebBundle);
          })();
          EOF

      - name: Publish Release with .swbn
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "iwa-build-${{ github.run_number }}"
          name: "Isolated Web App Build #${{ github.run_number }}"
          files: app.swbn
