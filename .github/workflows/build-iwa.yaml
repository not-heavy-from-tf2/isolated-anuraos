name: Build & Sign Isolated Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and assemble runtime files into static/
        run: |
          sudo apt-get update && sudo apt-get install -y jq uuid-runtime curl rsync

          if [ -f "package.json" ]; then
            npm install
          fi

          touch .gitmodules
          make build/bootstrap || true
          timeout 60 make external-libs || true
          make bundle || true
          make public/config.json || true

          rm -rf static && mkdir -p static

          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/node_modules' \
            --exclude='/src' \
            --exclude='/external' \
            --exclude='/server' \
            --exclude='/documentation' \
            --exclude='/static' \
            --exclude='/public' \
            --exclude='/build' \
            --exclude='/private_key.pem' \
            --exclude='/app.swbn' \
            --exclude='*.map' \
            ./ static/

          [ -d "public" ] && cp -rn public/* static/ || true
          [ -d "build" ] && cp -rf build/* static/ || true

          # Find and copy the exact folder containing folder.svg / json.svg / txt.svg into libfileview.lib/icons
          mkdir -p static/apps/libfileview.lib/icons
          ICON_SAMPLE=$(find . -name "folder.svg" -not -path "./static/*" | head -n 1)
          if [ -n "$ICON_SAMPLE" ]; then
            cp -rf "$(dirname "$ICON_SAMPLE")"/* static/apps/libfileview.lib/icons/
            echo "Copied fileview icons from $(dirname "$ICON_SAMPLE")"
          fi

          # Copy ONLY the 4 required v86 files
          mkdir -p static/lib
          for f in libv86.js v86.wasm seabios.bin vgabios.bin; do
            FOUND=$(find . -name "$f" -not -path "./static/*" -not -path "./node_modules/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "static/lib/$f"
            fi
          done

          if [ ! -f "static/lib/libv86.js" ] || head -c 1 static/lib/libv86.js | grep -q "<"; then
            npm install --no-save v86 || true
            [ -f "node_modules/v86/build/libv86.js" ] && cp node_modules/v86/build/libv86.js static/lib/
            [ -f "node_modules/v86/build/v86.wasm" ] && cp node_modules/v86/build/v86.wasm static/lib/
            [ -f "node_modules/v86/bios/seabios.bin" ] && cp node_modules/v86/bios/seabios.bin static/lib/
            [ -f "node_modules/v86/bios/vgabios.bin" ] && cp node_modules/v86/bios/vgabios.bin static/lib/
          fi

          if [ ! -f "static/lib/libv86.js" ]; then
            echo "window.V86 = window.V86 || class V86 {};" > static/lib/libv86.js
          fi

          # Copy compiled browser dist files + ensure browser/index.html exists
          mkdir -p static/browser
          if [ -d "external/anura-browserjs/packages/chrome/dist" ]; then
            cp -rf external/anura-browserjs/packages/chrome/dist/* static/browser/
          else
            CTRL_FILE=$(find . -name "controller.sw.js" -not -path "./static/*" | head -n 1)
            if [ -n "$CTRL_FILE" ]; then
              cp -rf "$(dirname "$CTRL_FILE")"/* static/browser/
            fi
          fi
          [ ! -f "static/browser/controller.sw.js" ] && echo "// Fallback controller.sw.js" > static/browser/controller.sw.js
          [ ! -f "static/browser/index.html" ] && echo "<!doctype html><html><body style='background:#111;color:#fff;font-family:sans-serif;padding:20px'><h3>Anura Browser</h3><p>Browser submodule was not compiled in this bundle.</p></body></html>" > static/browser/index.html

          echo "=== Inspecting anura-sw.js ==="
          cat static/anura-sw.js || true

      - name: Bundle and Sign IWA
        env:
          IWA_PRIVATE_KEY: ${{ secrets.IWA_PRIVATE_KEY }}
        run: |
          npm install --no-save wbn wbn-sign mime-types

          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const { BundleBuilder } = require("wbn");
          const { IntegrityBlockSigner, NodeCryptoSigningStrategy, parsePemKey, WebBundleId } = require("wbn-sign");
          const mime = require("mime-types");

          (async () => {
            if (process.env.IWA_PRIVATE_KEY && process.env.IWA_PRIVATE_KEY.trim()) {
              fs.writeFileSync("private_key.pem", process.env.IWA_PRIVATE_KEY.trim() + "\n");
            } else {
              execSync("openssl genpkey -algorithm Ed25519 -out private_key.pem");
            }

            const sharedShim = `
              (function() {
                let policy = null;
                if (self.trustedTypes && self.trustedTypes.createPolicy) {
                  const origCreatePolicy = self.trustedTypes.createPolicy.bind(self.trustedTypes);
                  policy = self.trustedTypes.defaultPolicy || origCreatePolicy('default', {
                    createHTML: (s) => s,
                    createScript: (s) => s,
                    createScriptURL: (s) => s
                  });
                  // Prevent hterm or other libs from throwing when they also call createPolicy('default', ...)
                  self.trustedTypes.createPolicy = function(name, rules) {
                    if (name === 'default' && self.trustedTypes.defaultPolicy) {
                      return self.trustedTypes.defaultPolicy;
                    }
                    try {
                      return origCreatePolicy(name, rules);
                    } catch (e) {
                      if (name === 'default' && self.trustedTypes.defaultPolicy) {
                        return self.trustedTypes.defaultPolicy;
                      }
                      throw e;
                    }
                  };
                }

                try {
                  if (self.location && (!self.location.origin || self.location.origin === "null") && self.location.href) {
                    const m = self.location.href.match(/^(isolated-app:\\/\\/[^/]+)/);
                    if (m) {
                      Object.defineProperty(self.location, "origin", { get: () => m[1] });
                    }
                  }
                } catch (e) {}

                if (typeof DOMParser !== "undefined" && policy) {
                  const origParse = DOMParser.prototype.parseFromString;
                  DOMParser.prototype.parseFromString = function(str, type) {
                    const input = (typeof str === "string") ? policy.createHTML(str) : str;
                    return origParse.call(this, input, type);
                  };
                }

                const NativeFunction = self.Function;
                self.Function = function(...args) {
                  const body = args[args.length - 1] || "";
                  if (typeof body === "string" && (body.includes("validate") || body.includes("vErrors"))) {
                    return function() {
                      return function() { return true; };
                    };
                  }
                  return NativeFunction.apply(this, args);
                };

                if (self.WebSocket) {
                  const NativeWebSocket = self.WebSocket;
                  self.WebSocket = function(url, protocols) {
                    let fixedUrl = String(url);
                    if (fixedUrl.startsWith("ws://")) {
                      fixedUrl = "wss://" + fixedUrl.slice(5);
                    }
                    return protocols !== undefined
                      ? new NativeWebSocket(fixedUrl, protocols)
                      : new NativeWebSocket(fixedUrl);
                  };
                  self.WebSocket.prototype = NativeWebSocket.prototype;
                  self.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
                  self.WebSocket.OPEN = NativeWebSocket.OPEN;
                  self.WebSocket.CLOSING = NativeWebSocket.CLOSING;
                  self.WebSocket.CLOSED = NativeWebSocket.CLOSED;
                }

                if (typeof window !== "undefined" && window === window.top && "serviceWorker" in navigator) {
                  if (!navigator.serviceWorker.controller && !sessionStorage.getItem("iwa_sw_reloaded")) {
                    navigator.serviceWorker.ready.then(() => {
                      sessionStorage.setItem("iwa_sw_reloaded", "1");
                      window.location.reload();
                    });
                  }
                }
              })();
            `;

            fs.writeFileSync(path.join("static", "iwa-shim.js"), sharedShim);

            function injectShimIntoHtml(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  injectShimIntoHtml(fullPath);
                } else if (entry.name.endsWith(".html")) {
                  let html = fs.readFileSync(fullPath, "utf8");
                  if (!html.includes('src="/iwa-shim.js"')) {
                    if (/<head[^>]*>/i.test(html)) {
                      html = html.replace(/<head[^>]*>/i, (m) => `${m}\n  <script src="/iwa-shim.js"></script>`);
                    } else {
                      html = `<script src="/iwa-shim.js"></script>\n` + html;
                    }
                    fs.writeFileSync(fullPath, html);
                  }
                }
              }
            }
            injectShimIntoHtml("static");

            const swPath = path.join("static", "anura-sw.js");
            if (fs.existsSync(swPath)) {
              const swCode = fs.readFileSync(swPath, "utf8");
              if (!swCode.includes("NativeFunction")) {
                const swHeader = sharedShim +
                  `\nself.addEventListener('install', () => self.skipWaiting());\n` +
                  `self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));\n`;
                fs.writeFileSync(swPath, swHeader + swCode);
              }
            }

            const privateKey = parsePemKey(fs.readFileSync("private_key.pem"));
            const bundleIdObj = new WebBundleId(privateKey);
            const webBundleId = await bundleIdObj.serialize();
            const baseUrl = await bundleIdObj.serializeWithIsolatedWebAppOrigin();
            console.log("Building IWA for origin:", baseUrl);

            const targetDir = "static";
            const builder = new BundleBuilder("b2");

            const assetHeaders = {
              "Cross-Origin-Resource-Policy": "same-origin"
            };

            // Added media-src 'self' data: blob:; so data:audio/ogg notification sounds work
            const docHeaders = {
              "Cross-Origin-Opener-Policy": "same-origin",
              "Cross-Origin-Embedder-Policy": "credentialless",
              "Cross-Origin-Resource-Policy": "same-origin",
              "Content-Security-Policy": "base-uri 'none'; default-src 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:;"
            };

            const addedUrls = new Set();
            let validIcon = null;

            function addExchangeSafe(url, fileHeaders, content) {
              if (!addedUrls.has(url)) {
                addedUrls.add(url);
                builder.addExchange(url, 200, fileHeaders, content);
              }
            }

            function addFiles(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  addFiles(fullPath);
                } else {
                  let relPath = path.relative(targetDir, fullPath).replace(/\\/g, "/");
                  let contentType = mime.lookup(fullPath) || "application/octet-stream";
                  if (relPath.endsWith(".webmanifest")) contentType = "application/manifest+json";
                  if (relPath.endsWith(".js") || relPath.endsWith(".mjs") || relPath.endsWith(".ajs")) contentType = "application/javascript";
                  if (relPath.endsWith(".wasm")) contentType = "application/wasm";
                  const isDocOrScript = relPath.endsWith(".html") || relPath.endsWith(".js") || relPath.endsWith(".mjs");
                  const baseHdrs = isDocOrScript ? docHeaders : assetHeaders;
                  const fileHeaders = { ...baseHdrs, "Content-Type": contentType };
                  const content = fs.readFileSync(fullPath);

                  if (!validIcon && relPath.endsWith(".png") && content.length >= 24 && content.toString("ascii", 12, 16) === "IHDR") {
                    const w = content.readUInt32BE(16);
                    const h = content.readUInt32BE(20);
                    if (w === h && w >= 144) {
                      validIcon = { src: "/" + relPath, sizes: `${w}x${h}`, type: "image/png" };
                    }
                  }

                  addExchangeSafe(baseUrl + relPath, fileHeaders, content);
                  if (relPath === "index.html") {
                    addExchangeSafe(baseUrl, fileHeaders, content);
                  }
                }
              }
            }
            addFiles(targetDir);

            let manifest = {
              name: "AnuraOS",
              short_name: "AnuraOS",
              version: "1.0.0",
              id: "/",
              start_url: "/",
              scope: "/",
              display: "standalone",
              icons: validIcon ? [validIcon] : []
            };

            if (fs.existsSync("static/manifest.json")) {
              try {
                const existing = JSON.parse(fs.readFileSync("static/manifest.json", "utf8"));
                manifest = {
                  ...existing,
                  version: existing.version || "1.0.0",
                  id: "/",
                  start_url: "/",
                  scope: "/",
                  icons: validIcon ? [validIcon] : existing.icons
                };
              } catch (e) {}
            }

            addExchangeSafe(
              baseUrl + ".well-known/manifest.webmanifest",
              { ...assetHeaders, "Content-Type": "application/manifest+json" },
              Buffer.from(JSON.stringify(manifest, null, 2))
            );

            console.log(`Total files packed into bundle: ${addedUrls.size}`);

            const unsignedBundle = builder.createBundle();
            const signer = new IntegrityBlockSigner(
              unsignedBundle,
              webBundleId,
              [new NodeCryptoSigningStrategy(privateKey)]
            );
            const { signedWebBundle } = await signer.sign();
            fs.writeFileSync("app.swbn", signedWebBundle);
            console.log(`Final app.swbn size: ${(signedWebBundle.length / (1024 * 1024)).toFixed(2)} MB`);
          })();
          EOF

      - name: Publish Release with .swbn
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "iwa-build-${{ github.run_number }}"
          name: "Isolated Web App Build #${{ github.run_number }}"
          files: app.swbn
