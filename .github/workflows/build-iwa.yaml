name: Build & Sign Isolated Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and assemble all runtime files into static/
        run: |
          sudo apt-get update && sudo apt-get install -y jq uuid-runtime curl rsync

          if [ -f "package.json" ]; then
            npm install
          fi

          touch .gitmodules
          make build/bootstrap || true
          make external-libs || true
          make bundle || true
          make public/config.json || true

          rm -rf static && mkdir -p static

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='server' \
            --exclude='documentation' \
            --exclude='static' \
            --exclude='public' \
            --exclude='build' \
            --exclude='private_key.pem' \
            --exclude='app.swbn' \
            ./ static/

          [ -d "public" ] && cp -rn public/* static/ || true
          [ -d "build" ] && cp -rf build/* static/ || true

          mkdir -p static/lib
          V86_FILE=$(find . -name "libv86.js" -not -path "./static/*" | head -n 1)
          if [ -n "$V86_FILE" ]; then
            cp "$V86_FILE" static/lib/libv86.js
          elif [ ! -f "static/lib/libv86.js" ]; then
            echo "window.V86 = window.V86 || class V86 {};" > static/lib/libv86.js
          fi

      - name: Bundle and Sign IWA
        env:
          IWA_PRIVATE_KEY: ${{ secrets.IWA_PRIVATE_KEY }}
        run: |
          npm install --no-save wbn wbn-sign mime-types

          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const zlib = require("zlib");
          const { execSync } = require("child_process");
          const { BundleBuilder } = require("wbn");
          const { IntegrityBlockSigner, NodeCryptoSigningStrategy, parsePemKey, WebBundleId } = require("wbn-sign");
          const mime = require("mime-types");

          function createFallbackPng(size) {
            const width = size, height = size;
            const raw = Buffer.alloc((width * 4 + 1) * height);
            for (let y = 0; y < height; y++) {
              raw[y * (width * 4 + 1)] = 0;
              for (let x = 0; x < width; x++) {
                const idx = y * (width * 4 + 1) + 1 + x * 4;
                raw[idx] = 30; raw[idx + 1] = 136; raw[idx + 2] = 229; raw[idx + 3] = 255;
              }
            }
            const compressed = zlib.deflateSync(raw);
            function chunk(type, data) {
              const len = Buffer.alloc(4); len.writeUInt32BE(data.length, 0);
              const t = Buffer.from(type, "ascii");
              const crcBuf = Buffer.concat([t, data]);
              let crc = 0xffffffff;
              for (const b of crcBuf) {
                crc ^= b;
                for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
              }
              const crcOut = Buffer.alloc(4); crcOut.writeUInt32BE((crc ^ 0xffffffff) >>> 0, 0);
              return Buffer.concat([len, t, data, crcOut]);
            }
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(width, 0); ihdr.writeUInt32BE(height, 4);
            ihdr[8] = 8; ihdr[9] = 6;
            return Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk("IHDR", ihdr),
              chunk("IDAT", compressed),
              chunk("IEND", Buffer.alloc(0))
            ]);
          }

          (async () => {
            if (process.env.IWA_PRIVATE_KEY && process.env.IWA_PRIVATE_KEY.trim()) {
              fs.writeFileSync("private_key.pem", process.env.IWA_PRIVATE_KEY.trim() + "\n");
            } else {
              execSync("openssl genpkey -algorithm Ed25519 -out private_key.pem");
            }

            // 1. Create external /iwa-shim.js for Trusted Types
            const shimCode = `
              if (window.trustedTypes && window.trustedTypes.createPolicy && !window.trustedTypes.defaultPolicy) {
                window.trustedTypes.createPolicy('default', {
                  createHTML: (s) => s,
                  createScript: (s) => s,
                  createScriptURL: (s) => s
                });
              }
            `;
            fs.writeFileSync(path.join("static", "iwa-shim.js"), shimCode);

            const indexPath = path.join("static", "index.html");
            if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, "utf8");
              if (!html.includes('src="/iwa-shim.js"')) {
                html = html.replace(/<head>/i, '<head>\n  <script src="/iwa-shim.js"></script>');
                fs.writeFileSync(indexPath, html);
              }
            }

            // 2. Patch filer.min.js safely so ajv skips new Function()
            function patchFiler(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  patchFiler(fullPath);
                } else if (entry.name === "filer.min.js") {
                  let code = fs.readFileSync(fullPath, "utf8");
                  const patched = code.replace(
                    /new Function\("refVal",[^)]+\)/g,
                    '(function(){return function(){return true;}})'
                  );
                  if (patched !== code) {
                    fs.writeFileSync(fullPath, patched);
                    console.log("Patched new Function() out of:", fullPath);
                  }
                }
              }
            }
            patchFiler("static");

            const privateKey = parsePemKey(fs.readFileSync("private_key.pem"));
            const bundleIdObj = new WebBundleId(privateKey);
            const webBundleId = await bundleIdObj.serialize();
            const baseUrl = await bundleIdObj.serializeWithIsolatedWebAppOrigin();
            console.log("Building IWA for origin:", baseUrl);

            const targetDir = "static";
            const builder = new BundleBuilder("b2");

            const headers = {
              "Cross-Origin-Opener-Policy": "same-origin",
              "Cross-Origin-Embedder-Policy": "credentialless",
              "Cross-Origin-Resource-Policy": "same-origin",
              "Content-Security-Policy": "base-uri 'none'; default-src 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:;"
            };

            const addedUrls = new Set();
            let validIcon = null;

            function addExchangeSafe(url, fileHeaders, content) {
              if (!addedUrls.has(url)) {
                addedUrls.add(url);
                builder.addExchange(url, 200, fileHeaders, content);
              }
            }

            function addFiles(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  addFiles(fullPath);
                } else {
                  let relPath = path.relative(targetDir, fullPath).replace(/\\/g, "/");
                  let contentType = mime.lookup(fullPath) || "application/octet-stream";
                  if (relPath.endsWith(".webmanifest")) contentType = "application/manifest+json";
                  if (relPath.endsWith(".js") || relPath.endsWith(".mjs") || relPath.endsWith(".ajs")) contentType = "application/javascript";

                  const fileHeaders = { ...headers, "Content-Type": contentType };
                  const content = fs.readFileSync(fullPath);

                  if (!validIcon && relPath.endsWith(".png") && content.length >= 24 && content.toString("ascii", 12, 16) === "IHDR") {
                    const w = content.readUInt32BE(16);
                    const h = content.readUInt32BE(20);
                    if (w === h && w >= 144) {
                      validIcon = { src: "/" + relPath, sizes: `${w}x${h}`, type: "image/png" };
                    }
                  }

                  addExchangeSafe(baseUrl + relPath, fileHeaders, content);
                  if (relPath === "index.html") {
                    addExchangeSafe(baseUrl, fileHeaders, content);
                  }
                }
              }
            }

            addFiles(targetDir);

            if (!validIcon) {
              const fallbackPng = createFallbackPng(192);
              addExchangeSafe(baseUrl + "iwa-fallback-icon.png", { ...headers, "Content-Type": "image/png" }, fallbackPng);
              validIcon = { src: "/iwa-fallback-icon.png", sizes: "192x192", type: "image/png" };
              console.log("Generated fallback 192x192 PNG icon");
            }

            let manifest = {
              name: "AnuraOS",
              short_name: "AnuraOS",
              version: "1.0.0",
              id: "/",
              start_url: "/",
              scope: "/",
              display: "standalone",
              icons: [validIcon]
            };

            if (fs.existsSync("static/manifest.json")) {
              try {
                const existing = JSON.parse(fs.readFileSync("static/manifest.json", "utf8"));
                manifest = {
                  ...existing,
                  version: existing.version || "1.0.0",
                  id: "/",
                  start_url: "/",
                  scope: "/",
                  icons: [validIcon]
                };
              } catch (e) {}
            }

            addExchangeSafe(
              baseUrl + ".well-known/manifest.webmanifest",
              { ...headers, "Content-Type": "application/manifest+json" },
              Buffer.from(JSON.stringify(manifest, null, 2))
            );

            console.log(`Total files packed into bundle: ${addedUrls.size}`);
            const unsignedBundle = builder.createBundle();
            const signer = new IntegrityBlockSigner(
              unsignedBundle,
              webBundleId,
              [new NodeCryptoSigningStrategy(privateKey)]
            );
            const { signedWebBundle } = await signer.sign();
            fs.writeFileSync("app.swbn", signedWebBundle);
            console.log(`Final app.swbn size: ${(signedWebBundle.length / (1024 * 1024)).toFixed(2)} MB`);
          })();
          EOF

      - name: Publish Release with .swbn
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "iwa-build-${{ github.run_number }}"
          name: "Isolated Web App Build #${{ github.run_number }}"
          files: app.swbn
