name: Build & Sign Isolated Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build project if package.json exists
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build --if-present
          fi

      - name: Bundle and Sign IWA
        env:
          IWA_PRIVATE_KEY: ${{ secrets.IWA_PRIVATE_KEY }}
        run: |
          npm install --no-save wbn wbn-sign mime-types

          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const { BundleBuilder } = require("wbn");
          const { IntegrityBlockSigner, NodeCryptoSigningStrategy, parsePemKey, WebBundleId } = require("wbn-sign");
          const mime = require("mime-types");

          (async () => {
            if (process.env.IWA_PRIVATE_KEY && process.env.IWA_PRIVATE_KEY.trim()) {
              fs.writeFileSync("private_key.pem", process.env.IWA_PRIVATE_KEY.trim() + "\n");
            } else {
              execSync("openssl genpkey -algorithm Ed25519 -out private_key.pem");
            }

            const privateKey = parsePemKey(fs.readFileSync("private_key.pem"));
            const bundleIdObj = new WebBundleId(privateKey);
            const webBundleId = await bundleIdObj.serialize();
            const baseUrl = await bundleIdObj.serializeWithIsolatedWebAppOrigin();
            console.log("Building IWA for origin:", baseUrl);

            const builder = new BundleBuilder("b2");

            const headers = {
              "Cross-Origin-Opener-Policy": "same-origin",
              "Cross-Origin-Embedder-Policy": "credentialless",
              "Cross-Origin-Resource-Policy": "same-origin",
              "Content-Security-Policy": "base-uri 'none'; default-src 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:;"
            };

            const ignoredDirs = new Set([".git", ".github", "node_modules", "src"]);
            const ignoredFiles = new Set(["private_key.pem", "app.swbn", "package.json", "package-lock.json", "tsconfig.json", ".gitignore"]);
            const addedUrls = new Set();

            function addExchangeSafe(url, fileHeaders, content) {
              if (!addedUrls.has(url)) {
                addedUrls.add(url);
                builder.addExchange(url, 200, fileHeaders, content);
              }
            }

            function addFiles(dir, stripPrefix = "") {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (!ignoredDirs.has(entry.name)) {
                    addFiles(fullPath, stripPrefix);
                  }
                } else {
                  if (dir === "." && ignoredFiles.has(entry.name)) continue;

                  let relPath = path.relative(stripPrefix || ".", fullPath).replace(/\\/g, "/");
                  let contentType = mime.lookup(fullPath) || "application/octet-stream";
                  if (relPath.endsWith(".webmanifest")) contentType = "application/manifest+json";
                  if (relPath.endsWith(".js") || relPath.endsWith(".mjs")) contentType = "application/javascript";

                  const fileHeaders = { ...headers, "Content-Type": contentType };
                  const content = fs.readFileSync(fullPath);

                  addExchangeSafe(baseUrl + relPath, fileHeaders, content);
                  if (relPath === "index.html") {
                    addExchangeSafe(baseUrl, fileHeaders, content);
                  }
                }
              }
            }

            addFiles(".");
            addFiles("public", "public");
            addFiles("dist", "dist");

            if (!addedUrls.has(baseUrl + ".well-known/manifest.webmanifest")) {
              console.warn("WARNING: .well-known/manifest.webmanifest was NOT found in the bundle!");
            } else {
              console.log("Verified: .well-known/manifest.webmanifest is packed.");
            }

            const unsignedBundle = builder.createBundle();

            const signer = new IntegrityBlockSigner(
              unsignedBundle,
              webBundleId,
              [new NodeCryptoSigningStrategy(privateKey)]
            );
            const { signedWebBundle } = await signer.sign();
            fs.writeFileSync("app.swbn", signedWebBundle);
          })();
          EOF

      - name: Publish Release with .swbn
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "iwa-build-${{ github.run_number }}"
          name: "Isolated Web App Build #${{ github.run_number }}"
          files: app.swbn
